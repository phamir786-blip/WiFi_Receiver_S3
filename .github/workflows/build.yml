name: Build ESP32-S3 N16R8

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1
      - name: Create merged flash image
        run: |
          BUILD="$PWD/.pio/build/esp32-s3-devkitc-1"
          python - <<'PY'
          from pathlib import Path

          build = Path(".pio/build/esp32-s3-devkitc-1")
          framework = Path.home() / ".platformio/packages/framework-arduinoespressif32"
          inputs = [
              (0x0000, build / "bootloader.bin"),
              (0x8000, build / "partitions.bin"),
              (0xE000, framework / "tools/partitions/boot_app0.bin"),
              (0x10000, build / "firmware.bin"),
          ]
          for offset, path in inputs:
              if not path.is_file():
                  raise SystemExit(f"Missing required binary: {path}")

          flash_size = 16 * 1024 * 1024
          end = max(offset + path.stat().st_size for offset, path in inputs)
          if end > flash_size:
              raise SystemExit(f"Images exceed 16MB flash: 0x{end:X}")

          out = build / "WiFi_Receiver_S3-N16R8-merged.bin"
          data = bytearray(b"\\xFF") * flash_size
          for offset, path in inputs:
              blob = path.read_bytes()
              data[offset:offset + len(blob)] = blob

          out.write_bytes(data)
          print(f"Created {out} ({out.stat().st_size} bytes)")
          if out.stat().st_size != flash_size:
              raise SystemExit("Merged BIN size verification failed")
          PY
          test -s "$BUILD/WiFi_Receiver_S3-N16R8-merged.bin"
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WiFi_Receiver_S3-N16R8-firmware
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/WiFi_Receiver_S3-N16R8-merged.bin
