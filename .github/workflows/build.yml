name: Build ESP32-S3 N16R8

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1
      - name: Create merged flash image
        run: |
          BUILD=.pio/build/esp32-s3-devkitc-1
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/boot_app0.bin"
          test -f "$BUILD/firmware.bin"
          pio pkg exec --package "platformio/tool-esptoolpy" -- \
            esptool.py --chip esp32s3 merge_bin \
            --format raw \
            --flash-size 16MB \
            -o "$BUILD/WiFi_Receiver_S3-N16R8-merged.bin" \
            0x0000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xE000 "$BUILD/boot_app0.bin" \
            0x10000 "$BUILD/firmware.bin"
          ls -lh "$BUILD/WiFi_Receiver_S3-N16R8-merged.bin"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WiFi_Receiver_S3-N16R8-firmware
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/WiFi_Receiver_S3-N16R8-merged.bin
