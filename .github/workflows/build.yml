name: Build ESP32-S3 N16R8

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1
      - name: Verify generated image inputs
        run: |
          BUILD="$PWD/.pio/build/esp32-s3-devkitc-1"
          test -s "$BUILD/bootloader.bin"
          test -s "$BUILD/partitions.bin"
          test -s "$BUILD/firmware.bin"
          test -s "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          echo "bootloader: $(stat -c%s "$BUILD/bootloader.bin") bytes"
          echo "partitions:  $(stat -c%s "$BUILD/partitions.bin") bytes"
          echo "firmware:    $(stat -c%s "$BUILD/firmware.bin") bytes"

      - name: Create compact merged flash image
        run: |
          BUILD="$PWD/.pio/build/esp32-s3-devkitc-1"
          python - <<'PY'
          from pathlib import Path

          build = Path(".pio/build/esp32-s3-devkitc-1")
          framework = Path.home() / ".platformio/packages/framework-arduinoespressif32"
          inputs = [
              (0x0000, build / "bootloader.bin"),
              (0x8000, build / "partitions.bin"),
              (0xE000, framework / "tools/partitions/boot_app0.bin"),
              (0x10000, build / "firmware.bin"),
          ]

          for offset, path in inputs:
              if not path.is_file():
                  raise SystemExit(f"Missing required binary: {path}")

          # Build only through the last populated byte. Do not pad to the
          # physical 16 MB flash size.
          end = max(offset + path.stat().st_size for offset, path in inputs)
          out = build / "WiFi_Receiver_S3-N16R8-merged.bin"

          data = bytearray([0xFF]) * end
          for offset, path in inputs:
              blob = path.read_bytes()
              data[offset:offset + len(blob)] = blob

          out.write_bytes(data)
          actual_size = out.stat().st_size
          print(f"Created {out} ({actual_size} bytes / {actual_size / 1024:.1f} KiB)")
          print(f"Image range: 0x00000000 - 0x{end - 1:08X}")

          if actual_size != end:
              raise SystemExit("Merged BIN size verification failed")
          PY
          test -s "$BUILD/WiFi_Receiver_S3-N16R8-merged.bin"
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WiFi_Receiver_S3-N16R8-firmware
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/WiFi_Receiver_S3-N16R8-merged.bin
